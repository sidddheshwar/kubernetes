## Interview Summary (30 सेकंद)

> **Deployment** हा Kubernetes Object आहे जो ReplicaSet च्या मदतीने Pods manage करतो. `replicas` ने किती Pods चालवायचे ते ठरवतो. `selector` आणि `labels` Pod identify करतात. `resources` मधून CPU/Memory requests आणि limits define करतो. `readinessProbe` Pod ला traffic मिळण्यापूर्वी health check करते, तर `livenessProbe` application hang झाल्यास container restart करते. त्यामुळे application highly available आणि self-healing राहते.

ही नोट्स GitHub वर `Deployment-Notes.md` किंवा `README.md` मध्ये सेव्ह केल्यास पुढे revision साठी खूप उपयोगी पडतील.

