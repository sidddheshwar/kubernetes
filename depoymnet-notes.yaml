# Readiness Probe

```yaml
readinessProbe:
```

Purpose

➡️ Pod Traffic घेण्यासाठी Ready आहे का?

Check

```yaml
httpGet:
  path: /
  port: 80
```

Meaning

```
GET http://Pod-IP:80/
```

जर HTTP 200 आला

✅ Ready

जर 404 / 500 आला

❌ Not Ready

Pod Running राहील पण Service Traffic पाठवणार नाही.

---

## initialDelaySeconds

```yaml
initialDelaySeconds: 5
```

Container सुरू झाल्यावर

5 Seconds Wait

मग Probe सुरू.

---

## periodSeconds

```yaml
periodSeconds: 5
```

प्रत्येक 5 सेकंदांनी Check.

---

# Liveness Probe

```yaml
livenessProbe:
```

Purpose

➡️ Application जिवंत आहे का?

Check

```yaml
httpGet:
  path: /
  port: 80
```

जर Success

✅ काहीच नाही

जर Fail

❌ Kubernetes Container Restart करेल.

---

## initialDelaySeconds

```yaml
10
```

Application ला Start व्हायला Time देतो.

---

## periodSeconds

```yaml
10
```

प्रत्येक 10 Seconds ला Health Check.

