```

➡️ CPU आणि Memory control.

---

## Requests

```yaml
requests:
```

➡️ Minimum Resource.

Scheduler Pod ठेवताना इतका Resource Reserve करतो.

```yaml
cpu: 100m
memory: 128Mi
```

Meaning

CPU

100m = 0.1 CPU

Memory

128Mi = 128 MB

---

## Limits

```yaml
limits:
```

➡️ Maximum Resource.

Container Limit cross करू शकत नाही.

```yaml
cpu: 300m
memory: 256Mi
```

Meaning

CPU

300m = 0.3 CPU

Memory

256Mi

जर Memory 256Mi पेक्षा जास्त झाली

➡️ OOMKilled

