kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
  namespace: httpd

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
     metadata:
       labels:
         app: nginx
     spec:
       containers:
       - name: nginx-pod
         image: nginx:latest
         ports:
         - containerPort: 80
