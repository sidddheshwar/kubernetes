apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dev-dep
  namespace: testing

spec:

  replicas: 3

  selector:
    matchLabels:
      app: nginx

    
  template:
    metadata:
      labels:
        app: nginx

    spec:
     containers:
     - name: nginx-dev
       image: nginx:latest
       ports: 
       - containerPort: 80
