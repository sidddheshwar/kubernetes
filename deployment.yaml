apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dep
  namespace: httpd

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels: 
        app: nginx
    spec:
      containers:
      - image: nginx:latest
        name: nginx-dep-pod
        ports:
        - containerPort: 80
