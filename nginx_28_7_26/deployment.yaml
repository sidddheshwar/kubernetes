apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dep
  namespace: nginx

spec:
  replicas: 3

  selector:
    matchLabels:
        app: nginx

  template:
    metadata:
       labels:
         app: nginx

    spec:
      containers:
       - name: nginx-dep-pod
         image: nginx:1.31.3
         ports:
         - containerPort: 80

