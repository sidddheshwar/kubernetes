apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-readiness

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: python
        image: python:3.12-alpine

        command:
        - python
        - -c
        - |
          a = []
          while True:
            a.append("A" * 1024 * 1024)
  
        resources:
          requests:
            memory: "64Mi"
          limits:
            memory: "128Mi"
          
